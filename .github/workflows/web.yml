name: Web e2e and performance

# Typecheck, unit tests, lint and the normal build run in ci.yml. This
# workflow builds apps/web once against the mock fixture, runs the Playwright
# suite on it, then measures the same build with Lighthouse CI. Neither job
# needs apps/api or a database: e2e/mock-api.mjs stands in for the API.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_USE_MOCK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Build apps/web with the mock fixture
        run: npm run build -w apps/web

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx -w apps/web playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx -w apps/web playwright install-deps chromium

      - name: Playwright
        run: npm run e2e -w apps/web
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Hand the build to Lighthouse
        uses: actions/upload-artifact@v4
        with:
          name: web-mock-build
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          retention-days: 1

  lhci:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-mock-build
          path: apps/web/.next

      - name: Lighthouse CI
        run: npm run lhci -w apps/web

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          include-hidden-files: true
          retention-days: 7
