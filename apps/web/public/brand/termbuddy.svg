<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="TermBuddy">
  <rect width="1000" height="1000" fill="#2051CE"/>
  <!-- antenna: a stem topped with the brand's caret block -->
  <rect x="482" y="205" width="36" height="90" rx="10" fill="#F4F3F8"/>
  <rect x="446" y="150" width="108" height="72" rx="18" fill="#F4F3F8"/>
  <!-- ears -->
  <rect x="150" y="470" width="80" height="170" rx="26" fill="#F4F3F8"/>
  <rect x="770" y="470" width="80" height="170" rx="26" fill="#F4F3F8"/>
  <!-- head: the terminal window -->
  <rect x="210" y="285" width="580" height="480" rx="96" fill="#F4F3F8"/>
  <!-- eyes: a prompt chevron and a cursor block -->
  <path d="M345 430 L435 500 L345 570" fill="none" stroke="#2B2936" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="540" y="468" width="120" height="64" rx="16" fill="#2051CE"/>
  <!-- smile -->
  <path d="M400 640 Q500 705 600 640" fill="none" stroke="#2B2936" stroke-width="38" stroke-linecap="round"/>
</svg>
