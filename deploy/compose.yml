name: termspace-preview

x-service: &service
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:?required}?schema=public&connection_limit=5
  REDIS_URL: redis://redis:6379
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?required}
  CORS_ORIGINS: ${CORS_ORIGINS:?required}
  TRUST_PROXY: "1"
  EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?required}
  MARKETPLACE_PROVIDER_TOKEN_KEY: ${MARKETPLACE_PROVIDER_TOKEN_KEY:?required}
  LOCAL_AUTO_VERIFY_EMAIL: "false"
  SEED_DEMO: "false"
  SEED_RESET: "false"

services:
  db:
    # PostgreSQL's entrypoint needs its initial capabilities to prepare the volume,
    # then drops privileges to postgres itself; do not apply x-service cap_drop here.
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes: [database:/var/lib/postgresql/data]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *service
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: redis
    mem_limit: 96m
    cpus: 0.10
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, volatile-ttl]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 10s, timeout: 3s, retries: 10 }

  migrate:
    <<: *service
    restart: "no"
    image: ${OPS_IMAGE:?required}
    mem_limit: 384m
    environment: *api-env
    depends_on: { db: { condition: service_healthy } }

  api:
    <<: *service
    image: ${API_IMAGE:?required}
    mem_limit: 384m
    cpus: 0.35
    environment:
      <<: *api-env
      NODE_OPTIONS: --max-old-space-size=256
      PORT: "4001"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MEDIA_STORAGE: local
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:?required}
    volumes: [uploads:/app/apps/api/uploads]
    tmpfs: [/tmp:size=64m,mode=1777]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    <<: *service
    image: ${WEB_IMAGE:?required}
    mem_limit: 768m
    cpus: 0.50
    ports: ["127.0.0.1:3300:3000"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      API_URL: http://api:4001
      NEXT_PUBLIC_API_URL: /backend
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?required}
      NEXT_PUBLIC_BLOG_URL: ""
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-TermSpace}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/backend/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  source-worker:
    <<: *service
    image: ${API_IMAGE:?required}
    command: [node, /app/deploy/worker.mjs, source]
    mem_limit: 192m
    cpus: 0.15
    environment: *api-env
    tmpfs: [/tmp:size=16m,mode=1777]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: { test: [CMD, node, /app/deploy/worker.mjs, --health], interval: 30s, timeout: 5s, retries: 3, start_period: 60s }

  email-worker:
    <<: *service
    profiles: [email]
    image: ${API_IMAGE:?required}
    command: [node, /app/deploy/worker.mjs, email]
    mem_limit: 128m
    cpus: 0.10
    environment:
      <<: *api-env
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
    tmpfs: [/tmp:size=16m,mode=1777]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: { test: [CMD, node, /app/deploy/worker.mjs, --health], interval: 30s, timeout: 5s, retries: 3, start_period: 60s }

volumes:
  database:
  uploads:
