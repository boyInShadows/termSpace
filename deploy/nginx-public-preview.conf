# Additional SNI site; preserve the existing INSIGHT and private preview sites.
server {
    listen 80;
    server_name termspace.13.140.89.146.sslip.io;

    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/www/termspace-acme;
    }
    location / {
        return 308 https://termspace.13.140.89.146.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name termspace.13.140.89.146.sslip.io;
    ssl_certificate /etc/letsencrypt/live/termspace-public-preview/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termspace-public-preview/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Do not log queries, authorization, cookies or request bodies.
    access_log off;
    error_log /var/log/nginx/termspace-public-preview-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
