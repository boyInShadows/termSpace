# Dedicated private listener. Do not edit INSIGHT's existing server blocks.
server {
    listen 127.0.0.1:8443 ssl;
    server_name termspace.localhost;
    ssl_certificate /etc/termspace/tls/preview.pem;
    ssl_certificate_key /etc/termspace/tls/preview-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;

    # Do not log queries, authorization, cookies or request bodies.
    access_log off;
    error_log /var/log/nginx/termspace-preview-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
